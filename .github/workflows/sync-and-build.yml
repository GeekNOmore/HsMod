name: Auto Sync and Build

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    # CHANGED: Use Windows to support .NET Framework 4.8
    runs-on: windows-latest
    
    # CHANGED: Force all run steps to use Bash (so our sync script works on Windows)
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: bepinex5
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Sync with Upstream (Original Repo)
        id: sync
        run: |
          git remote add upstream https://github.com/Pik-4/HsMod
          git fetch upstream bepinex5
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/bepinex5)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "New updates detected. Merging..."
            git merge upstream/bepinex5 --allow-unrelated-histories -m "Auto-sync with upstream"
            git push origin bepinex5
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No new updates."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET 8
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build Project
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd HsMod
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Upload DLL Artifact
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HsMod-DLL
          path: HsMod/**/Release/**/*.dll
