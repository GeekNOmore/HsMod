name: Auto Sync and Build

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: bepinex5
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Sync with Upstream (Original Repo)
        id: sync
        run: |
          git remote add upstream https://github.com/Pik-4/HsMod
          git fetch upstream bepinex5
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/bepinex5)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "New updates detected. Merging..."
            git merge upstream/bepinex5 --allow-unrelated-histories -m "Auto-sync with upstream"
            git push origin bepinex5
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No new updates."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET 8
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build Project
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd HsMod
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Generate Release Tag
        id: tag
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "release_tag=v$(date +"%Y.%m.%d")-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Auto-Build ${{ steps.tag.outputs.release_tag }}
          files: HsMod/**/Release/**/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTIFICATION STEP
      - name: Notify via Bark
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          VERSION="${{ steps.tag.outputs.release_tag }}"
          curl -G "https://api.day.app/$BARK_KEY/HsMod/New%20Release%20$VERSION" \
            --data-urlencode "group=GitHub Actions"
