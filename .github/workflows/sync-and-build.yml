name: Auto Sync and Build

on:
  schedule:
    - cron: '0 19 * * *' # Checks daily at 6 AM Sydney time
  workflow_dispatch:      # Manual "Force Build" button

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: bepinex5
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Sync with Upstream (Original Repo)
        id: sync
        run: |
          git remote add upstream https://github.com/Pik-4/HsMod
          git fetch upstream bepinex5
          
          # CHANGED: We count commits in upstream that are NOT in our local repo yet.
          # If we are "ahead" (like you are now), this number will be 0.
          # If the original author pushes an update, this number will be > 0.
          NEW_COMMITS=$(git rev-list HEAD..upstream/bepinex5 --count)
          
          echo "New commits found in upstream: $NEW_COMMITS"
          
          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "New updates detected! Merging..."
            git merge upstream/bepinex5 --allow-unrelated-histories -m "Auto-sync with upstream"
            git push origin bepinex5
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "We are up to date (or ahead). No sync needed."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET 8
        # Runs if: (We found an update) OR (You clicked the manual button)
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build Project
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd HsMod
          dotnet restore
          # OUTPUT: Force file to ./BuildOutput so we know exactly where it is
          dotnet build --configuration Release --no-restore --output ./BuildOutput

      - name: Generate Release Tag
        id: tag
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "release_tag=v$(date +"%Y.%m.%d")-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Auto-Build ${{ steps.tag.outputs.release_tag }}
          # FILE: Points to the specific file in our custom folder
          files: HsMod/BuildOutput/HsMod.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Notify via Bark
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          VERSION="${{ steps.tag.outputs.release_tag }}"
          curl -G "https://api.day.app/$BARK_KEY/HsMod/New%20Release%20$VERSION" \
            --data-urlencode "group=GitHub Actions"
